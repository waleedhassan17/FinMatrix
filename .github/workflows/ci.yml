name: CI

# The app had no CI at all, so a type error or a payload the API rejects only
# showed up when someone ran a build by hand. The cost-method bug that made
# every inventory create fail with a 400 was exactly this shape: a value the
# app sent that the API had never accepted, with nothing checking the two
# agreed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # The hard gate. Clean today, and the class of check that would have
      # caught the cost-method mismatch.
      - name: Type-check
        run: npx tsc --noEmit

      # Informational for now: the codebase carries ~285 pre-existing lint
      # errors and ~1125 warnings. Failing the build on them from day one
      # would make this job noise that everyone learns to ignore. Burn the
      # backlog down, then drop continue-on-error and make it a real gate.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

      # No test files exist yet; --passWithNoTests keeps this honest rather
      # than green-by-absence once the first spec lands.
      - name: Unit tests
        run: npx jest --passWithNoTests
